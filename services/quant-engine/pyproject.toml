[project]
name = "quant-engine"
version = "0.1.0"
description = "Quant math engine skeleton — Black-Scholes pricer/Greeks. See ARCHITECTURE.md §6, §8."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
quant-engine-server = "quantengine.httpServer:runQuantEngineHttpServer"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
