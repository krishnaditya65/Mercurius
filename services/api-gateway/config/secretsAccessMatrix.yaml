# secretsAccessMatrix.yaml — FEATURES.md §13 "least-privilege IAM per
# service" half of the secrets-management item.
#
# WHAT THIS IS: a real, concrete, hand-maintained access matrix stating
# which service is allowed to read which secret. This is the DESIGN
# ARTIFACT the "least-privilege IAM" requirement actually asks for.
#
# WHAT THIS IS NOT: this file enforces NOTHING by itself. There is no
# real cloud IAM system in this environment (no AWS/GCP/Azure account, no
# Vault policy engine) to bind this matrix to, so nothing here is
# runtime-checked. Faking a Go "policy enforcer" that reads this YAML and
# pretends to gate access to secrets that don't really exist would be
# dishonest theater, not a real least-privilege control — so this
# repository does not include one. A real build wires this exact matrix
# into whatever real secrets manager (item 2 of the same FEATURES.md
# entry) is chosen — e.g. as Vault policies, one per service identity, or
# AWS IAM policies scoped to Secrets Manager ARNs — at which point it
# becomes a REAL, enforced control instead of documentation.
#
# Convention: one entry per Mercurius service. `secrets` lists the exact
# secret keys that service is allowed to read (as understood by
# internal/secretsprovider's SecretsProvider.GetSecret(key) — see
# services/api-gateway/internal/secretsprovider). Anything not listed for
# a service is, by this policy, a secret that service must NOT be able to
# read in a real deployment — even if, today, nothing stops it, because
# every service currently reads its own environment variables directly
# and there is no cross-service secret store to actually wall off.

services:
  ledger:
    description: >
      Owns client fund balances and the double-entry ledger. Needs
      database credentials and the payment-rail signing key for deposit
      confirmation callbacks.
    secrets:
      - ledgerDatabaseConnectionString
      - ledgerDatabaseReadReplicaConnectionString
      - paymentRailWebhookSigningSecret

  oms-gateway:
    description: >
      Order lifecycle orchestration. Needs credentials for talking to
      ledger, kyc-onboarding, matching-engine, quant-engine, and
      backoffice, plus the DMA/FIX-inspired gateway's per-institutional-
      client shared secret (session authentication, not covered by this
      illustrative gateway today — TODO for a real build).
    secrets:
      - omsInternalServiceToServiceAuthToken
      - dmaGatewayInstitutionalClientSharedSecrets

  kyc-onboarding:
    description: >
      Identity verification. Needs the third-party KYC/AML vendor API key
      (illustrative — no real vendor integration exists in this repo
      today) and document-storage credentials.
    secrets:
      - kycVendorApiKey
      - kycDocumentStorageAccessKey

  matching-engine:
    description: >
      Pure order-matching core. Needs NOTHING beyond its own process
      configuration — no external API keys, no database credentials
      (it's WAL-backed, not DB-backed). Listed explicitly to make the
      "least privilege" point: the tightest-scoped service in the
      platform should have the emptiest secrets list, not an empty list
      by omission.
    secrets: []

  market-data:
    description: >
      Feed ingestion and distribution. Needs the upstream exchange/feed
      vendor credentials (illustrative — this repo simulates the feed
      internally today, see simulatedExchangeFeedGenerator.rs).
    secrets:
      - marketDataFeedVendorApiKey

  mutual-funds:
    description: >
      AMC/RTA order routing (illustrative). Needs the AMC/RTA integration
      credentials and quant-engine's internal auth token for robo-advisory
      calls.
    secrets:
      - amcRtaIntegrationApiKey
      - quantEngineInternalServiceToken

  quant-engine:
    description: >
      Stateless analytics (Sharpe/Sortino/max-drawdown, robo-advisory
      allocation). Needs nothing beyond its own inbound auth token —
      it calls no third parties.
    secrets:
      - quantEngineInboundServiceToken

  backoffice:
    description: >
      Admin/support tooling with elevated read access to other services'
      data. Needs its own cross-service admin token, scoped separately
      from oms-gateway's own service-to-service token so a backoffice
      compromise can't be replayed as a live trading client.
    secrets:
      - backofficeAdminCrossServiceToken

  auth:
    description: >
      Identity/session issuance. Needs the JWT/session-signing key — the
      single most sensitive secret in the platform, since possessing it
      lets an attacker mint sessions for any account.
    secrets:
      - sessionTokenSigningKey
      - passwordHashingPepper

  api-gateway:
    description: >
      Reverse proxy, developer API-key issuance, rate limiting, webhooks,
      TCA, tenant config. Needs its own API-key-signing secret (used to
      derive/validate developer API keys — see internal/apikeymanager)
      and no direct database credentials for any backend service, since
      it only ever talks to backend services over their public HTTP APIs,
      never their datastores.
    secrets:
      - apiGatewayDeveloperApiKeySigningSecret
      - apiGatewayWebhookHmacSigningSecret

# Cross-cutting rule this matrix encodes (would be enforced as a
# default-deny IAM policy in a real deployment): a service may read ONLY
# the secrets listed under its own name above. No service should be
# provisioned with another service's database credentials, even if it
# technically has network reachability to that database — reachability
# and authorization are not the same thing, and this matrix is the
# authorization statement.
